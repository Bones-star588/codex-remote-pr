<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>更新 Codex Remote</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #0d0d0d; background: #fff; }
      body { margin: 0; padding: max(24px, env(safe-area-inset-top)) 20px; }
      main { max-width: 400px; margin: 15vh auto 0; }
      h1 { font-size: 22px; font-weight: 600; }
      p { line-height: 1.6; color: #626262; overflow-wrap: anywhere; }
      button { width: 100%; min-height: 44px; border: 0; border-radius: 8px; background: #202020; color: white; font: inherit; padding: 12px; cursor: pointer; }
      button:disabled { opacity: .55; cursor: default; }
      [data-error="true"] { color: #b42318; }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <main><h1>更新 Codex Remote</h1>
      <p>下载最新版本，完成后返回应用。登录信息和通知订阅会保留。</p>
      <p id="update-version"></p>
      <button id="update-button" type="button" disabled>正在加载更新工具…</button>
      <p id="update-status" role="status" aria-live="polite">网络较慢时请保持此页面打开。</p>
      <p><a href="/">返回应用</a></p>
      <noscript><p>请启用 JavaScript 后重新打开此页。</p></noscript>
    </main>
    <script type="module" src="/src/client/update-entry.ts"></script>
  </body>
</html>
